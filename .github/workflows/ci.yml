name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + API smoke tests)
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PORT: 5000
      MONGO_URI: mongodb://127.0.0.1:27017/farmlink_ci
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      # No network routing in CI: straight-line estimates are deterministic.
      ROUTING_PROVIDER: haversine
      # The ML service is not started here; the API degrades gracefully without it.
      ML_BASE: http://127.0.0.1:65530
      SWEEP_INTERVAL_MS: 0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: Unit tests
        run: npm run test:unit

      - name: Start API
        run: |
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ | grep -q '"connected"' && exit 0
            sleep 1
          done
          cat server.log
          exit 1

      - name: API smoke tests
        run: npm run test:smoke

      - name: Server log
        if: always()
        run: cat server.log || true

  ml:
    name: ML service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - run: pip install -r requirements.txt
      - name: Train models if missing
        run: |
          [ -f price_model.pkl ] || python train_model.py
          [ -f demand_model.pkl ] || python train_demand_model.py
      - run: python test_price_explain.py

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
